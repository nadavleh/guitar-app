# Deploys the chorect-web app to GitHub Pages — for FREE static hosting.
#
# Runs AUTOMATICALLY on every push to main that touches the web app (or this
# workflow), plus manually from Actions → "Deploy web to GitHub Pages" → "Run
# workflow". It used to be workflow_dispatch-only, which meant a push looked
# green while nothing had actually been type-checked or published until someone
# remembered to click Run — pushes and deploys are kept in lockstep instead.
# Android-only commits don't touch chorect-web/, so they cost no CI minutes.
#
# One-time setup (already done): GitHub → Settings → Pages → "Build and
# deployment" → Source = GitHub Actions. The site lives at
# https://<user>.github.io/<repo>/ (e.g. https://nadavleh.github.io/guitar-app/).
# The --base flag below must match the repo name so asset URLs resolve under
# that sub-path.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "chorect-web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Must stay false. Pages publishes are serialized on GitHub's side, and
  # cancelling a run mid-publish kills the deploy job while the Pages backend is
  # still syncing the artifact to the CDN — which leaves the deployment stuck in
  # "deployment_in_progress" forever and makes the next run queue behind it.
  # This is also what GitHub's own official Pages starter workflow uses.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chorect-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Type-check first so a type error fails the deploy loudly (vite/esbuild
      # alone strips types without checking them).
      - run: npx tsc --noEmit
      # Repo is served at /<repo>/ on project Pages, so build with that base.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chorect-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # NOTE: do NOT add a `timeout:` above 600000 here. deploy-pages@v4 hard-caps
        # this input at 600000 ms (10 min) and silently clamps anything larger with
        # "timeout value is greater than the allowed maximum". So the 10-minute wall
        # cannot be raised from the workflow.
        #
        # Consequence, seen on 2026-08-06: the Pages backend can publish the artifact
        # to the CDN and still never flip its status API from "deployment_in_progress"
        # to "success". The action then polls until the 10-minute cap, reports
        # "Timeout reached, aborting!", and cancels a deployment that is ALREADY LIVE.
        # So a red deploy job here does not prove the site is stale — before retrying,
        # check the built asset hash in the build log against the one the live
        # index.html references:
        #   curl -s https://nadavleh.github.io/guitar-app/ | grep -o 'assets/index-[^"]*\.js'
        # If they match, the deploy actually succeeded and no retry is needed.
